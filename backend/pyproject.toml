[project]
name = "noise-monitor-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.12",
  "jsonschema[format]==4.26.0",
  "tzdata==2026.5",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["noise_monitor*"]

[tool.ruff]
line-length = 100
target-version = "py310"
