name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: dependencies-and-blockers
    attributes:
      label: Known dependencies and blockers
      description: Link related issues or pull requests, and describe anything that prevents investigation or reproduction. Write "None known" if there are none.
      placeholder: |
        Related: #...
        Blockers: None known
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant device/board, firmware, browser, or version; do not include credentials.
    validations:
      required: true
