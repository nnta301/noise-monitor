name: Task
description: Propose an actionable task
title: "[Task]: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome must be achieved?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and what is out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The verifiable conditions for completion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link related issues or explicitly state that there are none.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: One accountable person (to be filled in by the team).
    validations:
      required: true
