name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes='

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD" --

      - name: Check main push whitespace
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          base="$BEFORE_SHA"
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git hash-object -w -t tree /dev/null)"
          fi
          git diff --check "$base" "$AFTER_SHA" --
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Schema Validator
        run: pip install "jsonschema[format]==4.26.0" "tzdata==2026.5"

      - name: Run Schema Validation
        run: python scripts/validate_schema.py

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: pip install -e "backend[dev]"

      - name: Lint backend
        run: python -m ruff check backend

      - name: Test backend
        run: python -m pytest backend/tests

  producer-checks:
    name: Simulator and firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install producer tooling
        run: python -m pip install -r scripts/requirements-dev.txt -e backend

      - name: Lint simulator
        run: ruff check scripts/simulate_telemetry.py scripts/check_firmware_contract.py scripts/verify_api_ingestion.py scripts/tests scripts/integration_tests

      - name: Test simulator with temporary local HTTP stub
        run: python -m unittest discover -s scripts/tests -v

      - name: Test feature aggregation on host
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/test/test_features.cpp -o "$RUNNER_TEMP/noise-features-test"
          "$RUNNER_TEMP/noise-features-test"

      - name: Compile sanitized ESP32 example
        run: pio run -d firmware -e esp32dev_example -e esp32dev_sampling_compile

      - name: Validate firmware-generated telemetry and acknowledgements
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include -Ifirmware/.pio/libdeps/esp32dev_example/ArduinoJson/src firmware/test/test_telemetry.cpp -o "$RUNNER_TEMP/noise-telemetry-test"
          "$RUNNER_TEMP/noise-telemetry-test" > "$RUNNER_TEMP/noise-telemetry.jsonl"
          python scripts/check_firmware_contract.py < "$RUNNER_TEMP/noise-telemetry.jsonl"

      - name: Test producers against project API and temporary SQLite
        run: NOISE_FIRMWARE_TEST_PACKETS="$RUNNER_TEMP/noise-telemetry.jsonl" python -m unittest discover -s scripts/integration_tests -v
