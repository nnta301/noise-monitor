[platformio]
default_envs = esp32dev_example

; Compile target only: confirm the actual board before selecting/uploading.
[env:esp32dev_example]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra

; Compile the active sampling/upload path with empty credentials. Never flash
; this environment: it exists only to catch linking/configuration regressions.
[env:esp32dev_sampling_compile]
extends = env:esp32dev_example
build_flags = ${env:esp32dev_example.build_flags} -DNOISE_HARDWARE_CONFIRMED=true
